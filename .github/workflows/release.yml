name: Release Plugin ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create plugin ZIP
        run: |
          mkdir customs-invoice-for-wcpdf
          rsync -a --exclude='.git' --exclude='.github' ./ customs-invoice-for-wcpdf/
          zip -r customs-invoice-for-wcpdf-${{ steps.version.outputs.VERSION }}.zip customs-invoice-for-wcpdf/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: customs-invoice-for-wcpdf-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
